name: palm_diagnose
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.5.3
  firebase_app_check: ^0.2.0+1
  google_sign_in: ^6.2.1
  cached_network_image: ^3.3.1
  syncfusion_flutter_charts: 30.1.42
  syncfusion_flutter_gauges: ^30.1.42
  url_launcher: ^6.2.5
  rive: ^0.12.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.1.0
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.5
  awesome_snackbar_content: ^0.1.3
  animations: ^2.0.3
  flutter_rating_bar: ^4.0.1
  geolocator: ^10.1.0
  geocoding: ^2.2.0
  http: ^1.4.0
  awesome_dialog: ^3.1.0
  lottie: ^3.3.1

  provider: ^6.1.2

  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  intl: ^0.20.2
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
    - assets/icons/
    - assets/images/
    - assets/images/news/
    - assets/animations/

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  background_color: "#083021" # warna background Android
  remove_alpha_ios: true

flutter_native_splash:
  color: "#083021" # background splash
  image: assets/images/logo_combined.png # logo utama
  fullscreen: true
  android_12:
    image: assets/images/logo_combined_android12.png
    icon_background_color: "#083021"
